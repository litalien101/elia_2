[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elia-ai"
version = "0.1.0"
description = "A CPU-first cognitive architecture for evidence-backed learning."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
voice = ["vosk>=0.3.45"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
